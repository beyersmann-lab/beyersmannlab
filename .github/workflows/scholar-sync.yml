name: Generate Publications from BibTeX

on:
  workflow_dispatch: # This lets you press a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '18'

      - name: Install Academic CLI
        run: npm install -g @academic/cli

      - name: Convert BibTeX to Wowchemy Markdown
        # This takes your file and puts it into a safe "automatic-publications" folder
        run: academic import --bibtex citations.bib --to content/automatic-publications

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Imported publications from BibTeX into automatic folder"
